# Adaptive Policies sweep, derived from cap-gemma4-12b-t06-m16384-roff.yaml by helper-scripts/make_ap_configs.py.
# Every LMP, including recovery and replanning, uses the condition's temperature,
# reasoning and token budget. Runtime limits match CaP's except the model-request
# budget (64, since recoveries need model calls) and the task deadline (1.5x CaP's,
# covering all generation, recovery and execution for one task).
llm:
  provider: lm_studio
  model: google/gemma-4-12b
  providers:
    lm_studio:
      base_url: http://127.0.0.1:1234/v1
      timeout: 1200
      models:
        google/gemma-4-12b:
          ap_policy:
            temperature: 0.6
            max_tokens: 16384
            reasoning_effort: none
          ap_function:
            temperature: 0.6
            max_tokens: 16384
            reasoning_effort: none
          ap_objects:
            temperature: 0.6
            max_tokens: 16384
            reasoning_effort: none
          ap_question:
            temperature: 0.6
            max_tokens: 16384
            reasoning_effort: none
          ap_recover:
            temperature: 0.6
            max_tokens: 16384
            reasoning_effort: none
          ap_replan:
            temperature: 0.6
            max_tokens: 16384
            reasoning_effort: none
weave:
  enabled: true
adaptive:
  placement: both
  task_seconds: 3600
  max_helpers: 24
  max_depth: 8
  max_model_requests: 64
  max_actions: 100
  max_queries: 1000
  max_source_bytes: 65536
  max_output_bytes: 1048576
  max_recoveries_per_checkpoint: 2
